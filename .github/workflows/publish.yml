# Stages a new npm version when a GitHub Release is published. npm trusted publishing (OIDC)
# authenticates the job, so no npm token is stored. A maintainer then approves the staged
# version with 2FA on npmjs.com (or `npm stage approve`) before it is public.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # lets npm exchange a GitHub OIDC token for a short-lived publish token

jobs:
  publish:
    runs-on: ubuntu-latest

    # Actions are pinned to commit SHAs and npm to an exact version, because this job can
    # mint a publish token. No dependency cache is restored here, so a poisoned cache entry
    # cannot reach the published package.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
    - run: npm install -g npm@12.2.1   # trusted publishing and staged publishing need a recent npm
    - run: npm ci
    - run: npm run build
    - run: npm test
    - name: Check the release tag matches package.json
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: test "v$(node -p "require('./package.json').version")" = "$TAG"
    - run: npm stage publish
